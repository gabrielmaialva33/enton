name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy

      # cpal needs ALSA headers for the audio/voice features.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      # cpal needs ALSA headers for the audio/voice features.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check (default features)
        run: cargo check --workspace --all-targets

      - name: Check (all features)
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # sherpa-onnx extracts its native libraries to target/sherpa-onnx-prebuilt,
      # which the cache prunes as "not a dependency" while keeping the build
      # script's fingerprint, so a restored target dir fails to link. Cache only
      # the registry here; this job takes about two minutes cold.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false

      - name: Test (default features)
        run: cargo test --workspace

      # Tests that need ONNX models or audio devices are ignored or skip
      # themselves when the model cache is absent.
      - name: Test (all features)
        run: cargo test --workspace --all-features

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny,cargo-machete

      - name: cargo deny
        run: cargo deny --all-features check

      - name: cargo machete
        run: cargo machete

  cross:
    name: Cross (aarch64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: aarch64-unknown-linux-musl

      # zig is the C cross compiler for aws-lc-sys (rustls) on musl.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-zigbuild

      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build lean binaries
        run: cargo zigbuild --release -p enton -p enton-e1 --target aarch64-unknown-linux-musl

      - name: Smoke test under qemu-user
        run: |
          qemu-aarch64 target/aarch64-unknown-linux-musl/release/enton --help
          qemu-aarch64 target/aarch64-unknown-linux-musl/release/e1-sim --seed 0

      # RFC 0001 §4: the core binary stays under 20 MB.
      - name: Core binary budget
        run: |
          size=$(stat -c %s target/aarch64-unknown-linux-musl/release/enton)
          echo "enton (aarch64-musl, lean): $size bytes"
          test "$size" -lt 20000000
